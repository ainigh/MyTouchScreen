name: build

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

jobs:
  core-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"
      - run: swift build
      - run: swift test
      - run: tools/check.sh

  app-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Build (debug, whole package)
        run: swift build 2>&1 | tee build.log
      - name: Test
        run: swift test
      - name: Bundle
        run: make app
      - name: Doctor (no camera on CI; checks the binary launches)
        run: GesturePointer.app/Contents/MacOS/GesturePointer --help
